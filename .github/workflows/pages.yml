# main に送ると、各 site フォルダを1つにまとめて GitHub Pages に公開する
#   portal/site     -> https://stay.neconote.net/
#   tsurumi/site    -> https://stay.neconote.net/tsurumi/
#   sawatari/site   -> https://stay.neconote.net/sawatari/
#   yoshinocho/site -> https://stay.neconote.net/yoshinocho/
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p _public
          cp -r portal/site/. _public/
          for b in tsurumi sawatari yoshinocho; do
            if [ -d "$b/site" ] && [ -n "$(ls -A $b/site)" ]; then
              mkdir -p "_public/$b" && cp -r "$b/site/." "_public/$b/"
            fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public
      - id: deployment
        uses: actions/deploy-pages@v4
